# Hooks exécutés automatiquement avant chaque commit (après `uv run pre-commit install`).
# Lancer sur tout le dépôt : `uv run pre-commit run --all-files`
# La version de ruff-pre-commit doit rester alignée avec celle de ruff dans uv.lock.
exclude: ^uv\.lock$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
