name: Wiki

# Publie le dossier wiki/ du dépôt vers le wiki GitHub (<repo>.wiki.git).
# Prérequis : le wiki doit être activé et contenir au moins une page (créée une fois via l'interface).

on:
  push:
    branches: ["main"]
    paths: ["wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo

      - name: Copy pages
        run: rsync -a --delete --exclude .git wiki/ wiki-repo/

      - name: Commit and push if changed
        working-directory: wiki-repo
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Wiki déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(wiki): sync depuis ${GITHUB_SHA::7}"
          git push
