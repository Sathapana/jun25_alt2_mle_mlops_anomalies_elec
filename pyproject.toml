[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anomalies-elec"
version = "0.1.0"
description = "Service MLOps de détection d'anomalies sur le réseau électrique français (éCO2mix RTE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.111.0",
    "holidays>=0.50",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.1.18",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "scipy>=1.13.0",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
mlops = [
    "evidently>=0.4.30",
    "mlflow>=2.14.0",
    "statsforecast>=1.7.5",
]

# Outils de développement : groupe installé par défaut par `uv sync` / `uv run`
# (exclure avec `--no-dev`, par exemple dans les images Docker de production).
[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anomalies_elec"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
