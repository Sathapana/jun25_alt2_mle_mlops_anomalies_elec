services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlruns/mlflow.db
      --default-artifact-root /mlflow/mlruns

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ANOMALIES_ELEC_CONFIG_PATH=configs/default.yaml
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    depends_on:
      - mlflow

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - ANOMALIES_ELEC_CONFIG_PATH=configs/default.yaml
      - API_BASE_URL=http://api:8000
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      - ANOMALIES_ELEC_CONFIG_PATH=configs/default.yaml
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    depends_on:
      - mlflow
