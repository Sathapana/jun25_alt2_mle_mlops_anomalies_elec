# Environnement local complet : PostgreSQL, MLflow, API FastAPI, Airflow, Grafana.
#   docker compose up --build -d
# Variables lues depuis `.env` (copie de `.env.example`) ; valeurs par défaut de dev sinon.
#
# Ports exposés :
#   API FastAPI  http://localhost:8000/docs     MLflow   http://localhost:5000
#   Airflow      http://localhost:8080          Grafana  http://localhost:3000
#   PostgreSQL   localhost:5432

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  image: anomalies-elec-airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    # Dev local uniquement : tout utilisateur est admin, pas d'écran de connexion.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-dev-only}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-anomalies}:${POSTGRES_PASSWORD:-anomalies}@postgres:5432/airflow
    # Variables transmises aux tâches (virtualenv /opt/anomalies-venv)
    ANOMALIES_ELEC_CONFIG_PATH: /opt/anomalies_elec/configs/default.yaml
    STORAGE_BACKEND: ${STORAGE_BACKEND:-parquet}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anomalies}:${POSTGRES_PASSWORD:-anomalies}@postgres:5432/${POSTGRES_DB:-anomalies}
    DATA_DIR: /opt/anomalies_elec/data
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./configs:/opt/anomalies_elec/configs:ro
    - ./data:/opt/anomalies_elec/data
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anomalies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anomalies}
      POSTGRES_DB: ${POSTGRES_DB:-anomalies}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts exécutés au premier démarrage uniquement (volume vide)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-anomalies}:${POSTGRES_PASSWORD:-anomalies}@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      ANOMALIES_ELEC_CONFIG_PATH: configs/default.yaml
      STORAGE_BACKEND: ${STORAGE_BACKEND:-parquet}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anomalies}:${POSTGRES_PASSWORD:-anomalies}@postgres:5432/${POSTGRES_DB:-anomalies}
      DATA_DIR: /app/data
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  # --- Airflow 3 (LocalExecutor) -------------------------------------------
  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --- Grafana (visualisation, lecture seule sur PostgreSQL) -----------------
  grafana:
    image: grafana/grafana-oss:12.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Lus par grafana/provisioning/datasources/postgres.yaml
      POSTGRES_USER: ${POSTGRES_USER:-anomalies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anomalies}
      POSTGRES_DB: ${POSTGRES_DB:-anomalies}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  mlflow-artifacts:
  airflow-logs:
  grafana-data:
